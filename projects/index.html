<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Projects by Aaron, rendered from local project metadata." />
    <meta name="theme-color" content="#0f1113" />
    <title>Projects</title>
    <link rel="stylesheet" href="../assets/css/theme.css" />
    <link rel="stylesheet" href="assets/css/projects-home.css" />
    <noscript><style>body.booting > .wrap { visibility: visible; animation: none; }</style></noscript>
  </head>
  <body class="booting" data-navpath="~/portfolio" data-navcmd="cd ~/portfolio/projects &amp;&amp; ls -la">
    <div class="wrap">
      <header class="term">
        <span class="host"><b>aaron</b>@portfolio:<span class="muted">~/portfolio/projects</span>$</span>
        <nav class="primary" aria-label="Primary">
          <a href="../index.html">home</a>
          <a href="index.html" aria-current="page">projects</a>
        </nav>
      </header>

      <main>
        <h1 class="listing-title">Projects</h1>
        <section class="listing" id="projects-grid" aria-live="polite"></section>
        <p class="muted prompt-end" aria-hidden="true">$ <span class="cursor"></span></p>
      </main>
    </div>

    <script src="assets/js/render-home.js"></script>
    <script src="../assets/js/boot.js"></script>
  </body>
</html>
